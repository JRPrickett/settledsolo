name: Provision isolated account database
on:
  workflow_dispatch:
    inputs:
      target:
        description: Account database environment
        required: true
        type: choice
        options: [preview, production]
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create or find account D1 database
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_TARGET: ${{ inputs.target }}
        run: |
          # pipefail matters: tee would otherwise hide a failed provisioning call.
          # A D1 database ID is configuration, not a credential, and is stored as a
          # repository variable; only the API token is secret, and it is never printed.
          set -euo pipefail
          node scripts/provision-accounts.mjs "$ACCOUNT_TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ACCOUNT_TARGET" = "preview" ]; then
            echo "Set the printed UUID as the ACCOUNTS_PREVIEW_D1_ID repository variable."
          else
            echo "Set the printed UUID as the ACCOUNTS_PRODUCTION_D1_ID repository variable."
          fi
