name: Count registered accounts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Account environment to count
        required: true
        type: choice
        options: [production, preview]

permissions:
  contents: read

jobs:
  count:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Count Better Auth users
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNTS_PREVIEW_D1_ID: ${{ vars.ACCOUNTS_PREVIEW_D1_ID }}
          ACCOUNTS_PRODUCTION_D1_ID: ${{ vars.ACCOUNTS_PRODUCTION_D1_ID }}
          ACCOUNT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          {
            echo "## Registered accounts"
            echo
            echo '\`\`\`'
            node scripts/account-stats.mjs "$ACCOUNT_TARGET"
            echo '\`\`\`'
          } | tee -a "$GITHUB_STEP_SUMMARY"
