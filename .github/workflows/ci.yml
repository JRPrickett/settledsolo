name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify legacy and modern apps
        run: npm run verify

  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile browser journeys
        run: npm run test:e2e

      - name: Verify production PWA offline relaunch
        run: npm run test:pwa

      - name: Upload account review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-review-screenshots
          path: test-results/**/account-*.png
          if-no-files-found: ignore
