name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      browser-needed: ${{ steps.browser-impact.outputs.needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Decide whether browser checks are needed
        id: browser-impact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          needed=false
          : > /tmp/changed-files.txt

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual CI run: browser checks requested."
            needed=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename' > /tmp/changed-files.txt
          elif [ "$EVENT_NAME" = "push" ]; then
            # A merge to main has already been tested as a PR. Avoid paying for
            # the same browser suite twice. Direct pushes still get browser
            # coverage when they touch browser-impacting files.
            associated_prs="$(gh api "repos/$REPOSITORY/commits/$CURRENT_SHA/pulls" --jq 'length')"
            if [ "$associated_prs" -gt 0 ]; then
              echo "Main push is associated with a PR; browser checks already ran before merge."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "Cannot determine a direct-push base commit; running browser checks safely."
              needed=true
            else
              gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$CURRENT_SHA" \
                --jq '.files[].filename' > /tmp/changed-files.txt
            fi
          fi

          # Record every file that makes the expensive browser suite necessary, so
          # each run states plainly why it did or did not run.
          : > /tmp/browser-triggers.txt
          if [ -s /tmp/changed-files.txt ]; then
            echo "Changed files:"
            cat /tmp/changed-files.txt

            while IFS= read -r file; do
              case "$file" in
                package.json|package-lock.json|.node-version|app-v2/e2e/*|app-v2/public/*|app-v2/index.html|app-v2/vite.config.ts|app-v2/playwright*.ts|worker/csp.ts)
                  echo "$file" >> /tmp/browser-triggers.txt
                  ;;
                app-v2/src/*)
                  # Fast Vitest-only changes should not download two browser engines.
                  # Source/runtime changes still receive the browser gate.
                  case "$file" in
                    *.test.ts|*.test.tsx|*.spec.ts|*.spec.tsx)
                      ;;
                    *)
                      echo "$file" >> /tmp/browser-triggers.txt
                      ;;
                  esac
                  ;;
              esac
            done < /tmp/changed-files.txt
            if [ -s /tmp/browser-triggers.txt ]; then needed=true; fi
          fi

          echo "Browser checks needed: $needed"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

          {
            if [ "$needed" = "true" ]; then
              echo "### Browser checks: running (Chromium + WebKit, about 5 minutes)"
              if [ -s /tmp/browser-triggers.txt ]; then
                if [ "$EVENT_NAME" = "pull_request" ]; then
                  echo "This pull request changes browser-impacting files, so every push to it re-runs the browser suite:"
                else
                  echo "Triggered by these browser-impacting files:"
                fi
                echo
                head -n 25 /tmp/browser-triggers.txt | sed 's/^/- `/; s/$/`/'
                total="$(wc -l < /tmp/browser-triggers.txt)"
                if [ "$total" -gt 25 ]; then echo "- …and $((total - 25)) more"; fi
              else
                echo "Requested manually, or the base commit could not be determined."
              fi
            else
              echo "### Browser checks: skipped"
              echo "No browser-impacting files changed (unit tests, docs and workflow-only changes do not need them)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify legacy and modern apps
        run: npm run verify

  browser:
    needs: test
    if: needs.test.outputs.browser-needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile browser journeys
        run: npm run test:e2e

      - name: Verify production PWA offline relaunch
        run: npm run test:pwa

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: |
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload account review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-review-screenshots
          path: test-results/**/account-*.png
          if-no-files-found: ignore
