name: Verify account configuration

# Reports whether an environment is ready to activate accounts, without
# deploying, applying D1 migrations or uploading secrets.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Account environment to check
        required: true
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Report account configuration
        shell: bash
        env:
          ACCOUNTS_ENABLED: ${{ vars.ACCOUNTS_ENABLED }}
          ACCOUNTS_PREVIEW_D1_ID: ${{ vars.ACCOUNTS_PREVIEW_D1_ID }}
          ACCOUNTS_PRODUCTION_D1_ID: ${{ vars.ACCOUNTS_PRODUCTION_D1_ID }}
          AUTH_ORIGIN: ${{ vars.AUTH_ORIGIN }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ACCOUNT_TARGET: ${{ inputs.target }}
        run: |
          # pipefail matters: tee would otherwise hide a failed preflight.
          set -euo pipefail
          {
            echo '```'
            node scripts/accounts-preflight.mjs "$ACCOUNT_TARGET"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
