name: Deploy SettledSolo Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settledsolo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNTS_ENABLED: ${{ vars.ACCOUNTS_ENABLED }}
      ACCOUNTS_PREVIEW_D1_ID: ${{ vars.ACCOUNTS_PREVIEW_D1_ID }}
      ACCOUNTS_PRODUCTION_D1_ID: ${{ vars.ACCOUNTS_PRODUCTION_D1_ID }}
      AUTH_ORIGIN: ${{ vars.AUTH_ORIGIN }}
      AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Check account configuration
        shell: bash
        run: |
          # pipefail matters: tee would otherwise hide a failed preflight.
          set -euo pipefail
          {
            echo '```'
            node scripts/accounts-preflight.mjs production
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify product
        run: npm run verify

      - name: Deploy production Worker
        run: node scripts/deploy-app.mjs production

      - name: Verify deployed account endpoints
        env:
          VERIFY_ORIGIN: ${{ vars.ACCOUNTS_VERIFY_ORIGIN || vars.AUTH_ORIGIN }}
        run: |
          if [ -z "$VERIFY_ORIGIN" ]; then
            echo "::notice::Endpoint verification skipped because neither ACCOUNTS_VERIFY_ORIGIN nor AUTH_ORIGIN is set."
            exit 0
          fi
          node scripts/accounts-verify.mjs "$VERIFY_ORIGIN"
